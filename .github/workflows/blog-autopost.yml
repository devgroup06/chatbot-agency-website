name: Auto-Generate Blog Posts (Mistral AI)

on:
  schedule:
    # 3 posts per day (UTC): 05:15, 11:15, 17:15
    - cron: '15 5 * * *'
    - cron: '15 11 * * *'
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of posts to generate'
        required: false
        default: '1'

concurrency:
  group: blog-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Generate blog post(s) with Mistral AI
        working-directory: website
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/generate-blog.mjs --count=${{ github.event.inputs.count || '1' }}

      - name: Commit and push new posts
        run: |
          git config user.name "dialoghive-bot"
          git config user.email "actions@github.com"
          git add website/content/blog/
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          else
            git commit -m "blog: auto-generated post via Mistral AI [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so this workflow builds and deploys the site itself.
      - name: Build static site
        if: env.SKIP_DEPLOY != 'true'
        working-directory: website
        run: npm run build

      # Same lftp mirror as deploy-website.yml — see the note there on why the
      # FTP-Deploy-Action was dropped.
      - name: Deploy to Hostinger via FTP
        if: env.SKIP_DEPLOY != 'true'
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.HOSTINGER_SERVER_DIR || './' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --parallel=4 --verbose=1 website/out/ $SERVER_DIR;
            bye
          "
