name: Deploy Website to Hostinger

on:
  push:
    branches: [master, main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static site
        working-directory: website
        run: npm run build

      # lftp mirrors the whole export. FTP-Deploy-Action kept dying with
      # "550 /_next/<buildId>: No such file or directory" — every Next build renames
      # that folder, and its stored diff went stale and aborted mid-deploy.
      # The FTP account logs straight into the demo.dialoghive.com docroot.
      - name: Deploy to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.HOSTINGER_SERVER_DIR || './' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --parallel=4 --verbose=1 website/out/ $SERVER_DIR;
            bye
          "
