name: Deploy Website to Hostinger

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'admin-php/**'
      - 'scripts/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static site
        working-directory: website
        run: npm run build

      # Ships over SSH as a single tar stream. FTP was unusable here: hundreds of
      # per-file connections kept getting dropped or throttled by the host.
      - name: Deploy site and admin panel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
          DEPLOY_DOCROOT: ${{ vars.DEPLOY_DOCROOT || 'domains/dialoghive.com/public_html' }}
          DEPLOY_SITE_URL: https://dialoghive.com
        run: bash scripts/deploy.sh --skip-build
